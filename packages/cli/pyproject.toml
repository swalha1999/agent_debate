# CLI surface — Typer app over the SDK (PRD §5.1, §6).
#
# This is only the skeleton (TASKS.md 0.2): the launch/watch commands are filled
# in by later tasks. The CLI is a thin shell over the ``core`` SDK.
[project]
name = "agent_debate_cli"
version = "1.00"
description = "agent_debate CLI — Typer surface over the SDK (skeleton)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate_cli"]
