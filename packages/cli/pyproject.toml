# CLI surface — Typer app over the SDK (PRD §5.1, §6).
#
# This is only the skeleton (TASKS.md 0.2): the launch/watch commands are filled
# in by later tasks. The CLI is a thin shell over the ``core`` SDK.
#
# Layout: PEP 420 implicit namespace package — the importable module is
# `agent_debate.cli` (no `__init__.py` at `src/agent_debate/`), so the
# `agent_debate` namespace merges across all five distributions (TASKS.md 0.3).
#
# Deps (issue #3): cli depends on both core and log.
[project]
name = "agent_debate_cli"
version = "1.00"
description = "agent_debate CLI — Typer surface over the SDK."
requires-python = ">=3.12"
dependencies = ["agent_debate_core", "agent_debate_log", "rich>=13", "typer>=0.12"]

[project.scripts]
# Console entry point (PRD §6): ``agent-debate run "<topic>"`` drives the SDK.
agent-debate = "agent_debate.cli.app:app"

[tool.uv.sources]
agent_debate_core = { workspace = true }
agent_debate_log = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate"]
