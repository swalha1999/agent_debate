# UI surface — web frontend over the API (PRD §5.1, §6).
#
# This is only the skeleton (TASKS.md 0.2): the live-transcript + verdict
# frontend is filled in by later tasks. The UI consumes the ``api`` surface.
#
# Layout: PEP 420 implicit namespace package — the importable module is
# `agent_debate.ui` (no `__init__.py` at `src/agent_debate/`), so the
# `agent_debate` namespace merges across all five distributions (TASKS.md 0.3).
#
# Deps (issue #3): ui depends on both core and log.
[project]
name = "agent_debate_ui"
version = "1.00"
description = "agent_debate UI — web frontend over the API."
requires-python = ">=3.12"
dependencies = [
    "agent_debate_core",
    "agent_debate_log",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
# Console entry point (PRD §6): serve the UI app via Uvicorn. Host/port are
# config-driven (``run_server`` reads ``UI_HOST`` / ``UI_PORT`` env or the named
# ``DEFAULT_UI_HOST`` / ``DEFAULT_UI_PORT`` constants).
agent-debate-ui = "agent_debate.ui.__main__:main"

[tool.uv.sources]
agent_debate_core = { workspace = true }
agent_debate_log = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate"]
