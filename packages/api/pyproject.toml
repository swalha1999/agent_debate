# API surface — FastAPI app over the SDK (PRD §5.1, §6).
#
# This is only the skeleton (TASKS.md 0.2): the run/stream/status endpoints are
# filled in by later tasks. The API is a thin shell over the ``core`` SDK.
[project]
name = "agent_debate_api"
version = "1.00"
description = "agent_debate API — FastAPI surface over the SDK (skeleton)."
requires-python = ">=3.12"
# Intra-workspace dependencies (TASKS.md 0.3): the API surface is a thin shell
# over the ``core`` SDK and logs through the shared ``log`` package (PRD §5.1).
dependencies = [
    "agent_debate_core",
    "agent_debate_log",
]

# Resolve the dependencies above to local workspace members, not PyPI.
[tool.uv.sources]
agent_debate_core = { workspace = true }
agent_debate_log = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate_api"]
