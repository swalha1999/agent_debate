# LOG package — shared logging surface (PRD §5.1, §5.7).
#
# This is only the skeleton (TASKS.md 0.2): structured logging, cost accounting,
# the log schema and sinks are filled in by later tasks. LOG is a shared
# dependency used by every other package.
#
# Layout: PEP 420 implicit namespace package — the importable module is
# `agent_debate.log` (no `__init__.py` at `src/agent_debate/`), so the
# `agent_debate` namespace merges across all five distributions (TASKS.md 0.3).
[project]
name = "agent_debate_log"
version = "1.00"
description = "agent_debate LOG — structured logging and cost accounting (skeleton)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate"]
