# SDK package — the heart of agent_debate (PRD §5.1, §5.4).
#
# This is only the skeleton (TASKS.md 0.2): the engine, agents, skills,
# controller, API gatekeeper and search plug-ins are filled in by later tasks.
#
# Layout: PEP 420 implicit namespace package — the importable module is
# `agent_debate.core` (no `__init__.py` at `src/agent_debate/`), so the
# `agent_debate` namespace merges across all five distributions (TASKS.md 0.3).
#
# Deps (issue #3): core depends on log.
[project]
name = "agent_debate_core"
version = "1.00"
description = "agent_debate SDK — the debate engine and agents (skeleton)."
requires-python = ">=3.12"
dependencies = [
    "agent_debate_log",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # LLM provider abstraction (PRD §4): map "provider:model" strings to model
    # objects so swapping providers is a config-only change. `[anthropic]` pulls
    # in the default-provider client (PRD §7 default = anthropic).
    "pydantic-ai-slim[anthropic]>=1.0,<2",
]

[tool.uv.sources]
agent_debate_log = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate"]
