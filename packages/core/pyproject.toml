# SDK package — the heart of agent_debate (PRD §5.1, §5.4).
#
# This is only the skeleton (TASKS.md 0.2): the engine, agents, skills,
# controller, API gatekeeper and search plug-ins are filled in by later tasks.
[project]
name = "agent_debate_core"
version = "1.00"
description = "agent_debate SDK — the debate engine and agents (skeleton)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate_core"]
