# Root of the `agent_debate` uv workspace.
#
# This is the single source of truth for shared tooling and the workspace layout
# (PRD §5.1). The five package surfaces live under `packages/*` and are added by
# later tasks (0.2+). The root depends on all five members so a single `uv sync`
# installs every surface into the shared venv, and so shared dev tooling installs
# in one place. Ruff/mypy/coverage config here is intentionally minimal — tasks
# 0.5 and 0.9 flesh it out.

[project]
name = "agent-debate-workspace"
version = "1.00"
description = "Workspace root for agent_debate — a multi-agent debate system."
readme = "README.md"
requires-python = ">=3.12"
# The root depends on every workspace member so a single `uv sync` installs all
# five surfaces (PRD §5.1) into the shared venv and they import cleanly.
dependencies = [
    "agent_debate_core",
    "agent_debate_log",
    "agent_debate_api",
    "agent_debate_cli",
    "agent_debate_ui",
]

[tool.uv.workspace]
members = ["packages/*"]

# Resolve the workspace dependencies above to the local packages, not PyPI.
[tool.uv.sources]
agent_debate_core = { workspace = true }
agent_debate_log = { workspace = true }
agent_debate_api = { workspace = true }
agent_debate_cli = { workspace = true }
agent_debate_ui = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_debate_workspace"]

# --- Shared tooling: lint + type-check gate (task 0.5) ------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
# `scripts/create_issues.py` is a one-off, data-heavy build-time generator whose
# source is mostly long embedded prompt strings that cannot be wrapped without
# mangling the data — linting it adds churn without value, so it stays excluded
# (task 0.5 decision). Real tooling under `scripts/` (e.g. the line-limit check,
# task 0.10) is NOT excluded: it is held to the same ruff gate as shipped code.
extend-exclude = ["scripts/create_issues.py"]

[tool.ruff.lint]
# Rule families for the 0-violation gate (issue #5):
#   E/W  pycodestyle errors + warnings   F  pyflakes (unused, undefined)
#   I    import sorting (isort)          UP pyupgrade (modern syntax)
#   B    flake8-bugbear (likely bugs)    SIM flake8-simplify
#   C4   comprehensions                  PIE misc lints
#   RET  return consistency              N  pep8-naming
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "N"]

[tool.ruff.format]
# Explicit so the `ruff format --check .` gate is deterministic.
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
# `strict` turns the full strict bundle on; the flags below are spelled out so
# the strict-ish contract is explicit and a later `strict = false` cannot
# silently relax them (task 0.5).
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
# The five surfaces share one PEP 420 `agent_debate` namespace package spread
# across `packages/*/src` (TASKS.md 0.3). Enable namespace mode and point mypy
# at those source roots so it resolves `agent_debate.<pkg>` even though there is
# no `__init__.py` at the namespace level.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/log/src",
    "packages/api/src",
    "packages/cli/src",
    "packages/ui/src",
    "src",
    "tests",
    # Each package `tests/` dir is its own base so its uniquely-named smoke test
    # (task 0.6, `test_<pkg>_smoke.py`) maps to a top-level module relative to
    # its own root rather than requiring an `__init__.py` under the namespace.
    "packages/core/tests",
    "packages/log/tests",
    "packages/api/tests",
    "packages/cli/tests",
    "packages/ui/tests",
]
# Default targets for a bare `uv run mypy` (over the namespace surfaces + tests).
files = [
    "packages/core/src/agent_debate",
    "packages/log/src/agent_debate",
    "packages/api/src/agent_debate",
    "packages/cli/src/agent_debate",
    "packages/ui/src/agent_debate",
    "src",
    "tests",
    # Per-package smoke tests stay type-checked (task 0.5 includes `tests`).
    "packages/core/tests",
    "packages/log/tests",
    "packages/api/tests",
    "packages/cli/tests",
    "packages/ui/tests",
    # Real build-time tooling is type-checked (task 0.10); the data-heavy
    # one-off `scripts/create_issues.py` generator stays out of scope.
    "scripts/check_line_limit.py",
]

[tool.pytest.ini_options]
# Discover both the root workspace tests and each package's own ``tests/`` dir
# (task 0.6, issue #6): every surface owns at least one trivial smoke test, and
# listing the paths explicitly keeps collection deterministic regardless of the
# invocation dir. New packages add their tests path here.
testpaths = [
    "tests",
    "packages/core/tests",
    "packages/log/tests",
    "packages/api/tests",
    "packages/cli/tests",
    "packages/ui/tests",
]
# Each per-package smoke test uses a unique basename (``test_<pkg>_smoke.py``)
# so the default ``prepend`` import mode does not collide across the ``tests/``
# dirs and no ``__init__.py`` is needed (which would break the PEP 420
# ``agent_debate`` namespace). The same unique-basename rule keeps mypy from
# reporting duplicate modules over these test files.

# --- Coverage gate (task 0.9, issue #9; PRD §6.2) ----------------------------
#
# Single source of truth for the ≥85% coverage threshold. ``pytest --cov`` reads
# this config, so the CI step carries no hard-coded number that could drift from
# config (issue #9: "avoid a hard-coded value diverging from config").

[tool.coverage.run]
# Measure only the shipped surfaces: the five packages share one PEP 420
# ``agent_debate`` namespace spread across ``packages/*/src`` (TASKS.md 0.3).
# Point coverage at those source roots so it reports per-package source and
# never counts the test tree toward the percentage.
source = [
    "packages/core/src",
    "packages/log/src",
    "packages/api/src",
    "packages/cli/src",
    "packages/ui/src",
]
# Account for the namespace packages installed into the shared venv as well as
# the in-tree sources so a single measurement is reported per file regardless of
# how the surface is imported.
branch = true

[tool.coverage.report]
# Enforce the mandated ≥85% threshold (PRD §6.2). The suite fails below it.
fail_under = 85
show_missing = true
